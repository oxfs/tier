name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    uses: ./.github/workflows/check.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tier-debian13-amd64
      - name: Publish tested amd64 container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS
          tar -xzf tier-debian13-amd64.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f tier/deploy/Dockerfile -t "$image" tier
          docker push "$image"
          docker logout ghcr.io
          docker pull "$image" || { echo "Make the GHCR package public before publishing this release." >&2; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes tier-debian13-amd64.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
