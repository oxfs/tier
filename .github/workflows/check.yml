name: Checks
on:
  push:
    branches: ['main']
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format shellcheck shfmt
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install ruff
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - run: make check
      - run: rust-analyzer diagnostics . --severity error
      - run: make build
      - name: Hardware collector and Web end-to-end test
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo unshare --mount --propagation private env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" TIER_BIN=../target/release/tier node node_modules/@playwright/test/cli.js test hardware.spec.js --workers=1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(target/release/tier --version | cut -d' ' -f2)" = "$GITHUB_REF_NAME"
      - name: Prepare Debian
        id: debian
        run: |
          mkdir -p "$RUNNER_TEMP/debian"
          sudo modprobe cifs
          docker run -d --name tier-builder --cap-add SYS_ADMIN --cap-add DAC_READ_SEARCH --security-opt apparmor=unconfined -v "$PWD:/workspace" -v "$RUNNER_TEMP/debian:/build" -w /workspace debian:13-slim sleep infinity
          docker exec tier-builder bash ci/debian.sh prepare
          echo "key=$(cat "$RUNNER_TEMP/debian/environment-key")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: samba-cache
        with:
          path: ${{ runner.temp }}/debian/samba
          key: samba-native-${{ steps.debian.outputs.key }}-${{ hashFiles('samba/build.sh', 'samba/wscript_build') }}
      - name: Build, install and test Samba package
        run: docker exec tier-builder bash ci/debian.sh
      - name: Build and test NAS container
        run: |
          mkdir -p target/docker-package
          tar -xzf "$RUNNER_TEMP/debian/artifacts/tier-debian13-amd64.tar.gz" -C target/docker-package
          cd target/docker-package/tier
          TIER_DISKS=/tmp docker compose -p tier-package -f deploy/compose.yml build tier
          docker tag tier-package-tier tier:test
          cd ../../..
          sudo apt-get install -y smbclient
          bash tests/container.sh
      - name: Test OpenList archive gateway
        run: |
          docker network create tier-archive-test
          docker network connect tier-archive-test tier-builder
          docker volume create tier-openlist-data
          docker run -d --name tier-openlist -e OPENLIST_ADMIN_PASSWORD=tier-test-password --network tier-archive-test --network-alias openlist --user 0:0 -v tier-openlist-data:/opt/openlist/data openlistteam/openlist:v4.2.9
          docker exec tier-openlist mkdir -p /archive
          docker exec -e OPENLIST_URL=http://openlist:5244 tier-builder python3 tests/openlist.py
      - uses: actions/cache/save@v4
        if: always() && steps.samba-cache.outcome == 'success' && steps.samba-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/debian/samba
          key: ${{ steps.samba-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: tier-debian13-amd64
          path: ${{ runner.temp }}/debian/artifacts/*
      - name: Remove test container
        if: always()
        run: |
          docker logs tier-openlist || true
          docker rm -f tier-builder tier-openlist || true
          docker network rm tier-archive-test || true
          docker volume rm tier-openlist-data || true
