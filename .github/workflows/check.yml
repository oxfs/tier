name: Checks
on:
  push:
    branches: ['main']
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y clang clang-format libclang-dev cmake pkg-config
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-analyzer
      - run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-amd64-rust-${{ hashFiles('Cargo.lock') }}
      - run: make check
      - run: rust-analyzer diagnostics . --severity error
      - run: tests/capacity-smoke.sh
      - run: cargo build --release --locked
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(target/release/tier --version | cut -d' ' -f2)" = "$GITHUB_REF_NAME"
      - name: Build and test Debian Samba package
        run: |
          mkdir -p "$RUNNER_TEMP/tier-debian"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP/tier-debian:/build" \
            -e TIER_BIN=/workspace/target/release/tier \
            -w /workspace debian:13-slim /workspace/tests/debian-ci.sh
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP/tier-debian/artifacts:/artifacts" \
            -e TIER_PACKAGE=/artifacts/tier-debian13-amd64.tar.gz \
            -w /workspace debian:13-slim /workspace/tests/debian-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tier-debian13-amd64
          path: ${{ runner.temp }}/tier-debian/artifacts/*
          if-no-files-found: error
