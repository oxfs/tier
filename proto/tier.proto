syntax = "proto3";
package tier.ipc;

// Evolution contract: never renumber or reuse a field/enum number. Reserve the
// number AND name when deleting one. Additions must have safe absent-field
// behavior; a new mandatory semantic requires a negotiated capability or a new
// protocol_version, even if the bytes themselves remain decodable.
// Proto3 scalars below are not required: absent == zero/false/empty. Validate
// method-dependent requirements at the server boundary. Changes uses has_*
// flags because setting size/mode to zero must differ from leaving it unchanged.
// Message fields have presence; repeated entries may be empty. Do not depend on
// unknown fields surviving a Rust prost decode/re-encode cycle.

// The Unix stream carries a 24-byte big-endian header followed by this message
// and optional raw file bytes: magic=0x54494552, version:u16=1, flags:u16=0,
// request_id:u64, message_length:u32, data_length:u32. Responses echo request_id.
// Both lengths are bounded by HELLO's limits. Only WRITE requests and READ
// responses carry raw bytes. No request is automatically replayed on reconnect.
enum Method {
  INVALID = 0;
  HELLO = 1;
  ATTACH = 2;
  STAT_AT = 3;
  GETATTR = 4;
  OPEN = 5;
  SETATTR = 6;
  MKDIR = 7;
  RENAME = 8;
  UNLINK = 9;
  FSINFO = 10;
  READ = 11;
  WRITE = 12;
  SYNC = 13;
  CLOSE = 14;
  OPENDIR = 15;
  READDIR = 16;
  CLOSEDIR = 17;
  DETACH = 18;
  CONTROL_ATTACH = 19;
  REVOKE_ACK = 20;
}
enum Access { METADATA = 0; READ_ONLY = 1; WRITE_ONLY = 2; READ_WRITE = 3; }
enum Disposition { EXISTING = 0; CREATE_NEW = 1; OPEN_OR_CREATE = 2; }
message Timestamp { sint64 seconds = 1; uint32 nanos = 2; }
message Attr {
  string node_id = 1;
  uint64 inode = 2;
  bool directory = 3;
  uint64 size = 4;
  uint64 allocated = 5;
  uint32 mode = 6;
  uint32 uid = 7;
  uint32 gid = 8;
  uint32 nlink = 9;
  Timestamp atime = 10;
  Timestamp mtime = 11;
  Timestamp ctime = 12;
  Timestamp btime = 13;
  uint64 version = 14;
}
message Changes {
  uint64 size = 1;
  Timestamp atime = 2;
  Timestamp mtime = 3;
  uint32 mode = 4;
  bool has_size = 5;
  bool has_mode = 6;
  Timestamp btime = 7;
}
message Request {
  // Only fields used by method are meaningful; this is not a required-field set.
  Method method = 1;
  uint64 handle = 2;
  uint64 parent = 3;
  string name = 4;
  uint64 target_parent = 5;
  string target_name = 6;
  Access access = 7;
  Disposition disposition = 8;
  bool truncate = 9;
  bool directory = 10;
  bool replace = 11;
  uint64 offset = 12;
  uint32 length = 13;
  bool stable = 14;
  Changes changes = 15;
  uint32 max_entries = 16;
  uint32 max_bytes = 17;
  uint32 protocol_version = 18;
  string control_token = 19;
  uint64 cache_epoch = 20;
  bool local_access = 22;
}
// New local stat/open operations require a live control connection and an
// unexpired absolute CLOCK_MONOTONIC deadline, checked after the operation too.
// Successfully opened descriptors retain their OFD pin independently of grants.
message LocalMapping {
  bytes path = 2;
  uint64 epoch = 3;
  uint64 deadline_ns = 4;
  uint64 device = 5;
  uint64 inode = 6;
  bytes pin_path = 7;
  uint64 pin_offset = 8;
}
message Entry { string name = 1; Attr attr = 2; LocalMapping local = 3; }
message Response {
  // Linux errno, zero on success. Text is diagnostic only.
  int32 error = 1;
  string message = 2;
  uint64 handle = 3;
  Attr attr = 4;
  repeated Entry entries = 5;
  uint32 count = 6;
  bool eof = 7;
  bool created = 8;
  uint64 total_bytes = 9;
  uint64 free_bytes = 10;
  string instance = 11;
  uint32 protocol_version = 12;
  uint32 max_message = 13;
  uint32 max_data = 14;
  uint32 max_inflight = 15;
  string control_token = 16;
  // Unsolicited control notifications use frame ID zero and revoke cache_epoch.
  // REVOKE_ACK retires the mapping epoch; opened files remain independently pinned.
  uint64 cache_epoch = 17;
  uint64 lease_deadline_ns = 18;
  LocalMapping local = 19;
  uint32 max_handles = 20;
  uint32 max_cache_entries = 21;
}
