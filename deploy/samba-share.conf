[tier]
    path = /srv/tier/share
    preexec = /usr/bin/mountpoint -q -- "%P"
    preexec close = yes
    force group = tier
    read only = no
    oplocks = no
    level2 oplocks = no
    guest ok = no
    ea support = no
    store dos attributes = no
    map archive = no
    map hidden = no
    map system = no
