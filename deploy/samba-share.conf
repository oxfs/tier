[global]
    smb2 max read = 1048576
    smb2 max write = 1048576

[tier]
    path = /
    vfs objects = tier
    tier:socket = /run/tier/tier.sock
    force group = tier
    read only = no
    guest ok = no
    kernel share modes = no
    posix locking = no
    oplocks = no
    level2 oplocks = no
    ea support = no
    store dos attributes = no
    map archive = no
    map hidden = no
    map system = no
    map readonly = no
    strict sync = yes
    sync always = no
