<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>Tier 管理</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font: 16px system-ui;
      color: #182621;
      background: #f2f5f0;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      letter-spacing: -0.05em;
    }
    section {
      background: white;
      padding: 20px;
      border: 1px solid #c9d2ca;
      border-radius: 8px;
      margin: 12px 0;
    }
    label {
      display: block;
      margin: 10px 0;
    }
    select,
    textarea,
    button {
      font: inherit;
      padding: 8px;
    }
    textarea {
      display: block;
      width: 100%;
      font-family: monospace;
    }
    button {
      background: #204c3c;
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    pre {
      overflow: auto;
      white-space: pre-wrap;
    }
    section {
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th,
    td {
      text-align: left;
      padding: 6px;
      border-bottom: 1px solid #e2e7df;
      word-break: break-word;
    }
    input {
      font: inherit;
      padding: 5px;
    }
  </style>
  <h1>Tier 管理</h1>
  <button id="refresh">刷新状态</button>
  <main id="panels"></main>
  <section>
    <h2>管理操作</h2>
    <form id="form">
      <label
        >操作
        <select id="action">
          <option value="repair">触发修复</option>
          <option value="snapshot">导出快照</option>
          <option value="restore">恢复回收条目</option>
          <option value="purge">清理回收条目</option>
          <option value="policy">配置策略</option>
          <option value="target">配置本地目标</option>
          <option value="archive">配置 WebDAV 归档目标</option>
          <option value="cloud_policy">目录归档策略</option>
          <option value="backup_schedule">自动备份计划</option>
        </select></label
      >
      <div id="fields"></div>
      <button>执行</button>
    </form>
    <pre id="result" role="status"></pre>
  </section>
  <script>
    const el = (id) => document.getElementById(id);
    function show(value) {
      if (Array.isArray(value)) {
        if (value.length === 0) return document.createTextNode("暂无条目");
        if (value.every((x) => x && typeof x === "object")) {
          const table = document.createElement("table"),
            first = table.insertRow(),
            keys = [...new Set(value.flatMap((x) => Object.keys(x)))];
          for (const key of keys) {
            const th = document.createElement("th");
            th.textContent = key;
            first.append(th);
          }
          for (const entry of value) {
            const row = table.insertRow();
            for (const key of keys) {
              const cell = row.insertCell(),
                v = entry[key];
              cell.textContent =
                v == null
                  ? "—"
                  : typeof v === "object"
                    ? JSON.stringify(v)
                    : String(v);
            }
          }
          return table;
        }
      }
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(value, null, 2);
      return pre;
    }
    async function refresh() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        const state = await res.json();
        if (!res.ok) throw Error(state.error);
        el("panels").replaceChildren();
        for (const key of [
          "health",
          "pending_writes",
          "targets",
          "policies",
          "trash",
          "cloud_targets",
          "cloud_policy",
          "cloud_copies",
          "backup_schedule",
          "backup_status",
          "archive_errors",
        ]) {
          const value = state[key];
          if (value === undefined) continue;
          const section = document.createElement("section"),
            heading = document.createElement("h2");
          heading.textContent =
            {
              health: "副本健康",
              pending_writes: "写入未确认",
              targets: "存储目标",
              policies: "目录策略",
              trash: "回收站",
              cloud_targets: "归档目标",
              cloud_policy: "归档策略",
              cloud_copies: "归档副本",
              backup_schedule: "备份计划",
              backup_status: "备份状态",
              archive_errors: "归档异常",
            }[key] || key;
          section.append(heading, show(value));
          el("panels").append(section);
        }
      } catch (e) {
        el("result").textContent = e.message;
      }
    }
    const forms = {
      repair: [],
      archive: [
        ["name", "归档名称", "cloud1"],
        ["url", "WebDAV 地址", "https://nas.example/dav/tier"],
        ["user_env", "用户名环境变量（可选）", "optional"],
        ["pass_env", "密码环境变量（可选）", "optional"],
      ],
      cloud_policy: [
        ["path", "目录", "/"],
        ["targets", "归档目标（逗号分隔）", "cloud1"],
        ["copies", "归档份数", "1"],
        ["delay_secs", "归档延迟（秒）", "7776000"],
        ["retain_local", "保留本地份数", "1"],
      ],
      backup_schedule: [
        ["directories", "备份目录（逗号分隔）", "/mnt/a/backup,/mnt/b/backup"],
        ["seconds", "触发间隔（秒）", "30"],
        ["changes", "累计变更数", "100"],
        ["keep", "每目录保留份数", "20"],
      ],
      snapshot: [["path", "快照目的文件", "/mnt/backup/tier.json"]],
      restore: [
        ["id", "删除条目编号", "1"],
        ["path", "恢复位置", "/照片/example.jpg"],
      ],
      purge: [["id", "删除条目编号", "1"]],
      policy: [
        ["path", "目录", "/"],
        ["front", "前台目标（逗号分隔）", "ssd"],
        ["front_count", "前台确认份数", "1"],
        ["long", "长期目标（逗号分隔）", "disk1,disk2"],
        ["long_count", "长期份数", "2"],
        ["delay_secs", "安静期（秒）", "1800"],
        ["low_water", "慢速回收已用比例（%）", "70"],
        ["high_water", "同步回收已用比例（%）", "90"],
        ["trash_ttl_secs", "回收保留时间（秒）", "604800"],
        ["manual_repair", "手动修复", "checkbox"],
        ["repair_grace_secs", "故障修复宽限期（秒）", "0"],
        ["direct_fallback", "暂存不足时直接写长期池", "checkbox"],
      ],
      target: [
        ["name", "目标名称", "disk1"],
        ["path", "已存在的 Linux 目录", "/mnt/disk1"],
        ["domain", "故障域（留空自动识别）", "optional"],
        ["allow_same_domain", "接受多个目标位于同一设备", "checkbox"],
      ],
    };
    function drawFields() {
      el("fields").replaceChildren();
      for (const [id, title, hint] of forms[el("action").value]) {
        const label = document.createElement("label"),
          input = document.createElement("input");
        label.textContent = title + " ";
        input.name = id;
        if (hint === "checkbox") input.type = "checkbox";
        else {
          input.placeholder = hint === "optional" ? "" : hint;
          input.required = hint !== "optional";
          if (/^\d+$/.test(hint)) {
            input.type = "number";
            input.min = 0;
            input.value = hint;
          }
        }
        label.append(input);
        el("fields").append(label);
      }
    }
    el("action").onchange = drawFields;
    drawFields();
    el("refresh").onclick = refresh;
    el("form").onsubmit = async (event) => {
      event.preventDefault();
      if (
        el("action").value === "purge" &&
        !confirm("提前清理此条目？此操作无法撤销。")
      )
        return;
      try {
        const res = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: el("action").value,
            input: Object.fromEntries(
              [...el("fields").querySelectorAll("input")].map((e) => [
                e.name,
                e.type === "checkbox"
                  ? e.checked
                  : ["front", "long", "targets", "directories"].includes(e.name)
                    ? e.value
                        .split(",")
                        .map((x) => x.trim())
                        .filter(Boolean)
                    : e.type === "number"
                      ? Number(e.value)
                      : e.value,
              ]),
            ),
          }),
        });
        const result = await res.json();
        el("result").textContent = res.ok ? "操作已完成" : result.error;
        await refresh();
      } catch (e) {
        el("result").textContent = e.message;
      }
    };
    refresh();
  </script>
</html>
