[package]
name = "tier"
version = "0.2.1"
edition = "2024"
description = "Policy-driven storage for home Samba shares"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fuser = { version = "0.14", default-features = false }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks", "collation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
ureq = "2.12"
tempfile = "3"
unicase = "2"
