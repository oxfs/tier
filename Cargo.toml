[package]
name = "tier"
version = "0.5.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
libc = "0.2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
ureq = "2.12"
url = "2"
base64 = "0.22"
signal-hook = "0.3"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tiny_http = "0.12"
